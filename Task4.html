<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Space Animation</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #101a35;
            color: white;
        }

        .space {
            height: 100vh;
            position: relative;
            overflow: hidden;
        }

        h1 {
            text-align: center;
            margin-top: 30px;
        }

        .astronaut {
            position: absolute;
            width: 100px;
            top: 30%;
            left: 5%;
            animation: moveAstronaut 8s infinite alternate;
        }

        .astronaut img {
            width: 100%;
            height: auto;
        }

        .rocket {
            position: absolute;
            width: 80px;
            top: 60%;
            right: 10%;
            animation: moveRocket 6s infinite alternate;
        }

        @keyframes moveAstronaut {
            0% {
                transform: translate(0, 0) rotate(-10deg);
            }

            100% {
                transform: translate(55vw, 25vh) rotate(15deg);
            }
        }

        @keyframes moveRocket {
            0% {
                transform: translate(0, 0) rotate(-45deg);
            }

            100% {
                transform: translate(-50vw, -35vh) rotate(20deg);
            }
        }
    </style>
</head>

<body>

    <div class="space container-fluid">

        <h1>Welcome to Space 🚀</h1>

        <!-- Astronaut image -->
        <div class="astronaut">
            <img src="https://commons.wikimedia.org/wiki/Special:Redirect/file/Cartoon-Astronaut.svg" alt="Astronaut"
                onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">

            <!-- Backup if image does not load -->
            <span style="display:none; font-size:65px;">🧑‍🚀</span>
        </div>

        <!-- Rocket -->
        <div class="rocket">
            <img src="https://fonts.gstatic.com/s/e/notoemoji/latest/1f680/512.gif" alt="Rocket" style="width:100%;">
        </div>

    </div>

</body>

</html>
